<script src="/i18n.js"></script>
<script src="/nav.js"></script>
<script>
  // ── Helpers ──────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);

  function monthShortName(m) { return new Intl.DateTimeFormat(locale(), { month: 'short' }).format(new Date(2000, m, 1)); }
  function weekdayNarrowName(dow) { return new Intl.DateTimeFormat(locale(), { weekday: 'narrow' }).format(new Date(2023, 0, 1 + dow)); }
  let lastRenderData = null;
  // A theme switch redraws what's drawn in JS with the new colours.
  document.addEventListener('solastat:theme', () => {
    renderChartView();
    drawHistoryChart(historyState.buckets);
    if (lastRenderData) render(lastRenderData);
  });
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('solastat_lang', l); } catch (_) {}
    applyStaticI18n();
    updateDateDisplay();
    if ($('date-picker').classList.contains('open')) renderDatePicker();
    loadHistory();
    loadTotals();
    loadEventLog();
    if (lastRenderData) render(lastRenderData);
  }

  // Build API base from current route.
  // When opened via AppHub under /solastat, API is proxied at /solastat/api.
  const routePrefix = window.location.pathname.startsWith('/solastat') ? '/solastat' : '';
  const apiBase = window.location.origin + routePrefix;
  // Colours drawn in JS (charts, the battery fill) follow the theme: TC
  // picks the dark one (the page's own) or its light counterpart; SC does
  // it for a series colour, from its darker light-theme pair.
  const isLight = () => document.documentElement.dataset.theme === 'light';
  const TC = (dark, light) => (isLight() ? light : dark);
  const LIGHT_SERIES = {
    '#f59e0b': '#d97706', '#60a5fa': '#2563eb', '#818cf8': '#6366f1', '#34d399': '#059669',
    '#f472b6': '#db2777', '#2dd4bf': '#0d9488', '#fbbf24': '#ca8a04', '#a3e635': '#65a30d',
    '#fb923c': '#ea580c', '#fde047': '#ca8a04', '#a78bfa': '#7c3aed', '#fb7185': '#e11d48',
    '#22d3ee': '#0891b2', '#e879f9': '#c026d3', '#fca5a5': '#dc2626', '#38bdf8': '#0284c7',
    '#e4e4e7': '#3f3f46',
  };
  const SC = (c) => (isLight() && LIGHT_SERIES[c]) || c;

  const API = {
    data:    apiBase + '/api/data',
    profile: apiBase + '/api/profile',
    profiles: apiBase + '/api/profiles',
    ports:   apiBase + '/api/ports',
    history: apiBase + '/api/history',
    totals:  apiBase + '/api/totals',
    monthStart: apiBase + '/api/month-start',
    events:  apiBase + '/events',
  };



  function parseJsonOrThrow(response) {
    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      throw new Error(`Unexpected response (${response.status} ${response.statusText})`);
    }
    return response.json();
  }

  function fmt(v, dec) {
    if (v == null || isNaN(v)) return '--';
    return Number(v).toLocaleString('en', {
      minimumFractionDigits: dec ?? 0,
      maximumFractionDigits: dec ?? 0,
    });
  }

  const historyState = {
    range: 'day',
    date: '',
    buckets: [],
    start: null, end: null, // the loaded period, from /api/history
    monthStartDay: 1, // a month runs from this day to the same day next month
    timer: null,
  };

  const chartState = {
    plot: null, scales: {},
    snapshot: null, buckets: [], allBuckets: [], dpr: 1, cssW: 900,
  };

  const zoomState = { start: 0, end: -1 };

  function resetZoom() { zoomState.start = 0; zoomState.end = -1; }

  // The chart's views. Power is always there; AC and DC show the voltages
  // and currents the active profile reads (series with no reading never
  // show). Currents are dashed, on their own axis on the right. The grid
  // frequency is dotted, off until picked in the legend (with V and A it
  // makes the chart busy), on its own scale.
  const VIEWS = {
    power: [
      { key: 'solar_w',   color: '#f59e0b', label: () => t('legend_solar'),       tip: () => t('tooltip_solar'), unit: 'W' },
      { key: 'load_w',    color: '#60a5fa', label: () => t('legend_consumption'), tip: () => t('tooltip_load'),  unit: 'W' },
      { key: 'grid_w',    color: '#818cf8', label: () => t('legend_grid'),        tip: () => t('tooltip_grid'),  unit: 'W' },
      { key: 'battery_w', color: '#34d399', label: () => t('legend_battery'),     tip: () => t('tooltip_batt'),  unit: 'W' },
    ],
    // Single-phase (or L1), then L2 and L3: those only once their voltage
    // has been seen above 50 V (single-phase models may read them as 0).
    ac: [
      { key: 'grid_v', reading: 'grid_voltage', color: '#818cf8', label: () => phaseLabel(1) + ' V', unit: 'V' },
      { key: 'grid_a', reading: 'grid_current', color: '#f472b6', label: () => phaseLabel(1) + ' A', unit: 'A' },
      { key: 'grid_v_l2', reading: 'grid_voltage_l2', color: '#2dd4bf', label: () => 'L2 V', unit: 'V' },
      { key: 'grid_a_l2', reading: 'grid_current_l2', needs: 'grid_voltage_l2', color: '#fbbf24', label: () => 'L2 A', unit: 'A' },
      { key: 'grid_v_l3', reading: 'grid_voltage_l3', color: '#a3e635', label: () => 'L3 V', unit: 'V' },
      { key: 'grid_a_l3', reading: 'grid_current_l3', needs: 'grid_voltage_l3', color: '#fb923c', label: () => 'L3 A', unit: 'A' },
      { key: 'grid_f', reading: 'grid_frequency', color: '#e4e4e7', label: () => 'Hz', unit: 'Hz', off: true },
    ],
    dc: [
      // One colour per series (voltage, current), so no two lines look alike.
      ...[[1, '#f59e0b', '#fde047'], [2, '#a78bfa', '#fb7185'], [3, '#a3e635', '#22d3ee'], [4, '#e879f9', '#fca5a5']]
        .flatMap(([n, vColor, aColor]) => [
          { key: `pv${n}_v`, reading: `pv${n}_total_power_p_v`, color: vColor, label: () => `PV${n} V`, unit: 'V', producing: true },
          { key: `pv${n}_a`, reading: `pv${n}_total_power_p_i`, color: aColor, label: () => `PV${n} A`, unit: 'A', producing: true },
        ]),
      { key: 'battery_v', reading: 'battery_voltage', color: '#34d399', label: () => t('legend_battery') + ' V', unit: 'V' },
      { key: 'battery_a', reading: 'battery_current', color: '#38bdf8', label: () => t('legend_battery') + ' A', unit: 'A' },
    ],
  };
  // chartVisible: the legend's picks, remembered; a series never picked
  // starts on, unless it is marked off.
  const chartVisible = {};
  Object.values(VIEWS).flat().forEach(s => { chartVisible[s.key] = !s.off; });
  try { Object.assign(chartVisible, JSON.parse(localStorage.getItem('solastat_chart_series')) || {}); } catch (_) {}
  // Live readings seen since the page opened: a series shows once its
  // reading has (never hidden again, so one failed poll doesn't flicker).
  const seenReadings = new Set();
  // chartView is the view picked (remembered); shownView the one on screen,
  // Power until the picked one's readings have shown up.
  let chartView = 'power';
  try { chartView = localStorage.getItem('solastat_chart_view') || 'power'; } catch (_) {}
  if (!VIEWS[chartView]) chartView = 'power';
  let shownView = 'power';

  function viewSeries(view) {
    return VIEWS[view || shownView].filter(s => (!s.reading || seenReadings.has(s.reading)) && (!s.needs || seenReadings.has(s.needs)));
  }

  // phaseLabel: "Grid" on a single-phase inverter, "L1" once L2 shows.
  function phaseLabel(n) {
    return seenReadings.has('grid_voltage_l2') ? 'L' + n : t('legend_grid');
  }

  // unitDec: decimals a V, A or Hz value is shown with.
  const unitDec = (unit) => (unit === 'Hz' ? 2 : 1);

  function fmtUnit(v, unit) {
    if (unit === 'W') return (v > 0 ? '+' : '') + fmt(v) + ' W';
    return fmt(v, unitDec(unit)) + ' ' + unit;
  }

  function fmtBucketTime(ts, range) {
    if (ts == null) return '';
    const ms = typeof ts === 'number' && ts < 1e12 ? ts * 1000 : Number(ts);
    const d = new Date(ms);
    if (isNaN(d)) return String(ts);
    if (range === 'day')   return d.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit', hour12: false });
    if (range === 'month') return d.toLocaleDateString(locale(), { month: 'short', day: 'numeric' });
    return d.toLocaleDateString(locale(), { month: 'short', year: 'numeric' });
  }

  function drawTooltip(ctx, x, bucket, plot, range) {
    const series = viewSeries().map(s => ({ ...s, label: (s.tip || s.label)() }));
    const lines = series.filter(s => chartVisible[s.key] && bucket[s.key] != null && Number.isFinite(bucket[s.key]));
    if (!lines.length) return;

    const timeStr = fmtBucketTime(bucket.ts, range);
    const PAD = 9, LH = 15;
    const boxW = 130;
    const boxH = PAD * 2 + (timeStr ? LH + 4 : 0) + lines.length * LH;

    let bx = x + 14;
    if (bx + boxW > plot.x + plot.w + 4) bx = x - boxW - 14;
    const by = Math.max(plot.y + 2, Math.min(plot.y + plot.h - boxH - 2, plot.y + (plot.h - boxH) / 2));

    ctx.save();
    ctx.fillStyle = TC('rgba(17,17,19,0.95)', 'rgba(255,255,255,0.97)');
    ctx.strokeStyle = TC('rgba(63,63,70,0.9)', 'rgba(212,212,216,0.95)');
    ctx.lineWidth = 1;
    const r = 7;
    ctx.beginPath();
    ctx.moveTo(bx + r, by); ctx.lineTo(bx + boxW - r, by);
    ctx.quadraticCurveTo(bx + boxW, by, bx + boxW, by + r);
    ctx.lineTo(bx + boxW, by + boxH - r);
    ctx.quadraticCurveTo(bx + boxW, by + boxH, bx + boxW - r, by + boxH);
    ctx.lineTo(bx + r, by + boxH);
    ctx.quadraticCurveTo(bx, by + boxH, bx, by + boxH - r);
    ctx.lineTo(bx, by + r);
    ctx.quadraticCurveTo(bx, by, bx + r, by);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    let ty = by + PAD + 10;
    if (timeStr) {
      ctx.fillStyle = TC('#a1a1aa', '#52525b');
      ctx.font = '600 9.5px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(timeStr, bx + PAD, ty);
      ty += LH + 4;
    }
    for (const s of lines) {
      ctx.beginPath();
      ctx.arc(bx + PAD + 3.5, ty - 3.5, 3, 0, Math.PI * 2);
      ctx.fillStyle = SC(s.color); ctx.fill();
      ctx.fillStyle = TC('#a1a1aa', '#52525b');
      ctx.font = '10.5px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(s.label, bx + PAD + 11, ty);
      const v = bucket[s.key];
      ctx.fillStyle = TC('#f1f5f9', '#18181b');
      ctx.font = '600 10.5px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(fmtUnit(v, s.unit), bx + boxW - PAD, ty);
      ty += LH;
    }
    ctx.restore();
  }

  function toDateInputValue(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // cycleStart is the first day (YYYY-MM-DD) of the month holding iso, a
  // month starting on historyState.monthStartDay (as the server counts it).
  function cycleStart(iso) {
    const sd = historyState.monthStartDay;
    const d = new Date(iso + 'T00:00:00');
    if (d.getDate() < sd) d.setMonth(d.getMonth() - 1, 1);
    d.setDate(sd);
    return toDateInputValue(d);
  }

  // monthLabel: "10/2026", or "5 Oct – 4 Nov" when months follow a cycle.
  function monthLabel(iso) {
    const start = cycleStart(iso);
    if (historyState.monthStartDay === 1) return isoDateToDisplay(start.slice(0, 7));
    const s = new Date(start + 'T00:00:00');
    const e = new Date(s.getFullYear(), s.getMonth() + 1, s.getDate() - 1);
    const dm = (d) => d.getDate() + ' ' + monthShortName(d.getMonth()).replace(/\.$/, '');
    return dm(s) + ' – ' + dm(e);
  }

  function getHistoryLabel(range, date) {
    if (range === 'day') return t('history_view_day', { date: isoDateToDisplay(date) });
    if (range === 'month') return t('history_view_month', { date: monthLabel(date) });
    return t('history_view_year', { date: date.slice(0, 4) });
  }

  function drawArea(ctx, plot, buckets, key, color, yMin, yMax, zeroY) {
    const pts = [];
    for (let i = 0; i < buckets.length; i++) {
      const v = buckets[i][key];
      if (v == null || !Number.isFinite(v)) continue;
      pts.push({
        x: plot.x + (i / Math.max(1, buckets.length - 1)) * plot.w,
        y: plot.y + (1 - ((v - yMin) / Math.max(1e-9, yMax - yMin))) * plot.h,
      });
    }
    if (!pts.length) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, zeroY);
    for (const p of pts) ctx.lineTo(p.x, p.y);
    ctx.lineTo(pts[pts.length - 1].x, zeroY);
    ctx.closePath();
    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  // drawBand fills between key_min and key_max (hour and day buckets of a
  // voltage or current), so peaks show behind the average line.
  function drawBand(ctx, plot, buckets, key, color, yMin, yMax) {
    const xy = (i, v) => [plot.x + (i / Math.max(1, buckets.length - 1)) * plot.w,
                          plot.y + (1 - ((v - yMin) / Math.max(1e-9, yMax - yMin))) * plot.h];
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = color;
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        ctx.beginPath();
        run.forEach(([i, lo], n) => { const [x, y] = xy(i, lo); n ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        for (let n = run.length - 1; n >= 0; n--) { const [x, y] = xy(run[n][0], run[n][2]); ctx.lineTo(x, y); }
        ctx.closePath();
        ctx.fill();
      }
      run = [];
    };
    for (let i = 0; i < buckets.length; i++) {
      const lo = buckets[i][key + '_min'], hi = buckets[i][key + '_max'];
      if (lo == null || hi == null) { flush(); continue; }
      run.push([i, lo, hi]);
    }
    flush();
    ctx.restore();
  }

  // drawSeries: a voltage or power solid, a current dashed, a frequency
  // dotted.
  function drawSeries(ctx, plot, buckets, key, color, yMin, yMax, unit) {
    let started = false;
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = unit === 'A' || unit === 'Hz' ? 1 : 0.8;
    ctx.setLineDash(unit === 'A' ? [4, 3] : unit === 'Hz' ? [1.5, 2.5] : []);
    for (let i = 0; i < buckets.length; i++) {
      const v = buckets[i][key];
      if (v == null || Number.isNaN(v)) {
        started = false;
        continue;
      }
      const x = plot.x + (i / Math.max(1, buckets.length - 1)) * plot.w;
      const y = plot.y + (1 - ((v - yMin) / Math.max(1e-9, yMax - yMin))) * plot.h;
      if (!started) {
        ctx.moveTo(x, y);
        started = true;
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // niceScale: a [min, max] around lo..hi on round steps, for a V, A or Hz
  // axis. Hz spans at least 0.4 (49.8-50.2), so a grid's usual hundredths
  // look calm and a real excursion stands out.
  function niceScale(lo, hi, unit) {
    if (unit === 'A') lo = Math.min(0, lo);
    let span = hi - lo;
    const minSpan = unit === 'V' ? 4 : unit === 'Hz' ? 0.4 : 1;
    if (span < minSpan) { const mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; span = minSpan; }
    const raw = span / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => st >= raw);
    // (The epsilon keeps 49.8 / 0.1 from flooring to 497.)
    let yMin = Math.floor(lo / step + 1e-9) * step, yMax = Math.ceil(hi / step - 1e-9) * step;
    if (unit === 'A' && lo >= 0) yMin = Math.max(0, yMin);
    if (yMax === yMin) yMax = yMin + step;
    return { yMin, yMax };
  }

  function drawXLabels(ctx, plot, buckets, range) {
    if (!buckets || !buckets.length) return;
    const labelY = plot.y + plot.h + 14;
    const minSpacing = range === 'year' ? 26 : range === 'month' ? 18 : 34;
    let lastX = -Infinity;

    for (let i = 0; i < buckets.length; i++) {
      const b = buckets[i];
      if (!b.ts) continue;
      const ms = typeof b.ts === 'number' ? (b.ts < 1e12 ? b.ts * 1000 : b.ts) : Number(new Date(b.ts));
      if (isNaN(ms)) continue;
      const d = new Date(ms);

      let label = null;
      if (range === 'day') {
        if (d.getMinutes() === 0 && d.getHours() % 2 === 0)
          label = String(d.getHours()).padStart(2, '0') + 'h';
      } else if (range === 'month') {
        if (d.getHours() === 0)
          label = d.getDate().toString();
      } else {
        if (d.getDate() === 1)
          label = monthShortName(d.getMonth());
      }
      if (!label) continue;

      const x = plot.x + (i / Math.max(1, buckets.length - 1)) * plot.w;
      if (x - lastX < minSpacing) continue;

      ctx.strokeStyle = TC('rgba(161,161,170,0.2)', 'rgba(82,82,91,0.25)');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, plot.y + plot.h + 1);
      ctx.lineTo(x, plot.y + plot.h + 5);
      ctx.stroke();

      ctx.fillStyle = TC('#64748b', '#71717a');
      ctx.font = '10px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, labelY);
      lastX = x;
    }
    ctx.textAlign = 'left';
  }

  function drawHistoryChart(allBuckets) {
    const canvas = $('history-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    if (!ctx) return;

    chartState.allBuckets = allBuckets || [];

    // Apply zoom window
    const total = allBuckets ? allBuckets.length : 0;
    const zEnd = zoomState.end < 0 ? total - 1 : Math.min(zoomState.end, total - 1);
    const buckets = total > 0 ? allBuckets.slice(zoomState.start, zEnd + 1) : [];
    const isZoomed = zoomState.start > 0 || (zoomState.end >= 0 && zoomState.end < total - 1);

    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || 900;
    const cssH = canvas.clientHeight || 220;
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.clearRect(0, 0, cssW, cssH);
    ctx.fillStyle = TC('#0a0a0b', '#fafafa');
    ctx.fillRect(0, 0, cssW, cssH);

    if (!buckets || buckets.length === 0) {
      chartState.snapshot = null; chartState.plot = null;
      ctx.fillStyle = TC('#a1a1aa', '#52525b');
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillText(t('chart_no_data'), 14, 24);
      return;
    }

    const series = viewSeries().filter(sr => chartVisible[sr.key]);
    // Per unit: every visible value (and its band) sets that axis's range.
    const ranges = {};
    for (const sr of series) {
      for (const b of buckets) {
        for (const k of [sr.key, sr.key + '_min', sr.key + '_max']) {
          const v = b[k];
          if (v == null || !Number.isFinite(v)) continue;
          const r = ranges[sr.unit] || (ranges[sr.unit] = { lo: v, hi: v });
          if (v < r.lo) r.lo = v;
          if (v > r.hi) r.hi = v;
        }
      }
    }
    if (!Object.keys(ranges).length) {
      chartState.snapshot = null; chartState.plot = null;
      ctx.fillStyle = TC('#a1a1aa', '#52525b');
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillText(t('chart_no_valid'), 14, 24);
      return;
    }

    // Power: one axis, symmetric around 0 (W). V and A: V on the left, A
    // on the right (or alone on the left), each fitted to its values. Hz
    // takes a side left free, else has no axis: the tooltip reads it.
    const scales = {};
    if (ranges.W) {
      const absMax = Math.max(100, Math.abs(ranges.W.lo), Math.abs(ranges.W.hi));
      const yMax = Math.ceil(absMax / 100) * 100;
      scales.W = { yMin: -yMax, yMax };
    }
    for (const u of ['V', 'A', 'Hz']) if (ranges[u]) scales[u] = niceScale(ranges[u].lo, ranges[u].hi, u);
    const leftUnit = scales.W ? 'W' : scales.V ? 'V' : scales.A ? 'A' : 'Hz';
    const rightUnit = leftUnit === 'V' && scales.A ? 'A'
      : (leftUnit === 'V' || leftUnit === 'A') && scales.Hz ? 'Hz' : null;
    const plot = { x: 44, y: 10, w: cssW - 56 - (rightUnit ? 34 : 0), h: cssH - 46 };

    ctx.strokeStyle = TC('rgba(161,161,170,0.18)', 'rgba(82,82,91,0.14)');
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = plot.y + (i / 4) * plot.h;
      ctx.beginPath();
      ctx.moveTo(plot.x, y);
      ctx.lineTo(plot.x + plot.w, y);
      ctx.stroke();
    }

    const { yMin, yMax } = scales[leftUnit];
    ctx.fillStyle = TC('#a1a1aa', '#52525b');
    ctx.font = '11px system-ui, sans-serif';
    if (leftUnit === 'W') {
      const zeroY = plot.y + (1 - ((0 - yMin) / (yMax - yMin))) * plot.h;
      ctx.strokeStyle = TC('rgba(161,161,170,0.45)', 'rgba(82,82,91,0.4)');
      ctx.beginPath();
      ctx.moveTo(plot.x, zeroY);
      ctx.lineTo(plot.x + plot.w, zeroY);
      ctx.stroke();
      ctx.fillText(fmt(yMax) + 'W', 4, plot.y + 10);
      ctx.fillText('0W', 12, zeroY + 4);
      ctx.fillText('-' + fmt(yMax) + 'W', 2, plot.y + plot.h - 2);
    } else {
      // Top, middle and bottom of each axis, labelled in its unit.
      const axisLabels = (unit, x, align) => {
        const sc = scales[unit];
        const dec = unit === 'Hz' ? 2 : sc.yMax - sc.yMin < 10 ? 1 : 0;
        // "50.20" with Hz after it wouldn't fit the margin: the legend
        // names the unit.
        const suffix = unit === 'Hz' ? '' : unit;
        ctx.textAlign = align;
        [[sc.yMax, plot.y + 10], [(sc.yMax + sc.yMin) / 2, plot.y + plot.h / 2 + 4], [sc.yMin, plot.y + plot.h - 2]]
          .forEach(([v, y]) => ctx.fillText(fmt(v, dec) + suffix, x, y));
        ctx.textAlign = 'left';
      };
      axisLabels(leftUnit, plot.x - 4, 'right');
      if (rightUnit) axisLabels(rightUnit, plot.x + plot.w + 4, 'left');
    }

    for (const sr of series) {
      const sc = scales[sr.unit];
      drawBand(ctx, plot, buckets, sr.key, SC(sr.color), sc.yMin, sc.yMax);
      drawSeries(ctx, plot, buckets, sr.key, SC(sr.color), sc.yMin, sc.yMax, sr.unit);
    }

    drawXLabels(ctx, plot, buckets, historyState.range);

    if (isZoomed) {
      ctx.fillStyle = TC('rgba(161,161,170,0.5)', 'rgba(82,82,91,0.6)');
      ctx.font = '10px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(t('chart_zoom_hint'), plot.x + plot.w, plot.y + 12);
      ctx.textAlign = 'left';
    }

    chartState.plot = plot; chartState.scales = scales;
    chartState.buckets = buckets; chartState.dpr = dpr; chartState.cssW = cssW;
    chartState.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }

  function normalizeBuckets(raw) {
    return (raw || []).map((b) => {
      const out = { ts: b.ts };
      for (const k in b) if (k !== 'ts') out[k] = b[k] == null ? null : Number(b[k]);
      return out;
    });
  }

  // ── Chart export: the CSV of what the chart shows ────────
  // The whole period (day, month, year) or, when zoomed, from the first
  // shown bucket to the one after the last. Same format choice as Settings.
  function chartExportWindow() {
    const all = historyState.buckets;
    const secs = (v) => Math.floor(Date.parse(v) / 1000);
    let start = secs(historyState.start);
    let end = secs(historyState.end);
    if (all.length && (zoomState.start > 0 || zoomState.end >= 0)) {
      const zEnd = zoomState.end < 0 ? all.length - 1 : Math.min(zoomState.end, all.length - 1);
      start = secs(all[zoomState.start].ts);
      if (zEnd + 1 < all.length) end = secs(all[zEnd + 1].ts);
    }
    return Number.isFinite(start) && Number.isFinite(end) && end > start ? { start, end } : null;
  }

  $('chart-export-btn').addEventListener('click', async () => {
    const btn = $('chart-export-btn');
    const status = $('history-status');
    const win = chartExportWindow();
    if (!win) return;
    let format = null;
    try { format = localStorage.getItem('solastat_csv_format'); } catch (_) {}
    const params = new URLSearchParams({
      start: win.start, end: win.end,
      format: format || (lang === 'en' ? 'standard' : 'excel'),
    });
    const before = status.textContent;
    status.textContent = t('msg_exporting');
    btn.disabled = true;
    try {
      const r = await fetch(apiBase + '/api/history/export.csv?' + params);
      if (!r.ok) {
        const d = await parseJsonOrThrow(r);
        throw new Error(d.error || 'HTTP ' + r.status);
      }
      const blob = await r.blob();
      const match = /filename="([^"]+)"/.exec(r.headers.get('content-disposition') || '');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = match ? match[1] : 'solastat.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      status.textContent = before;
    } catch (e) {
      status.textContent = t('err_generic', { msg: e.message });
    } finally {
      btn.disabled = false;
    }
  });

  // Shown only when the active inverter can be restarted from here.
  fetch(apiBase + '/api/inverter/restart')
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.supported) $('inverter-restart-btn').hidden = false; })
    .catch(() => {});

  $('inverter-restart-btn').addEventListener('click', async () => {
    const ok = await window.solastatNav.confirm({
      title: t('inverter_restart_confirm_title'),
      message: t('inverter_restart_confirm'),
      okLabel: t('btn_inverter_restart_confirm'),
      destructive: true,
    });
    if (!ok) return;
    const btn = $('inverter-restart-btn');
    const status = $('history-status');
    btn.disabled = true;
    try {
      const r = await fetch(apiBase + '/api/inverter/restart', { method: 'POST' });
      const d = await parseJsonOrThrow(r);
      if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
      status.textContent = t('msg_inverter_restart_sent');
    } catch (e) {
      status.textContent = t('err_generic', { msg: e.message });
    } finally {
      btn.disabled = false;
    }
  });

  function setupHistoryAutoRefresh() {
    if (historyState.timer) clearInterval(historyState.timer);
    let lastToday = toDateInputValue(new Date());
    historyState.timer = setInterval(() => {
      const today = toDateInputValue(new Date());
      if (today !== lastToday && historyState.date === lastToday) {
        // Midnight while showing today: follow the new day (a page left
        // open, like the kiosk, would otherwise stay on yesterday).
        historyState.date = today;
        updateDateDisplay();
        loadHistory();
        loadTotals();
      } else if (historyState.range === 'day' && historyState.date === today && !document.hidden) {
        loadHistory();
      }
      lastToday = today;
    }, 60000);
  }

  // renderChartView shows the view tabs the readings allow (none when only
  // Power does), the active view's legend, and its stats.
  function renderChartView() {
    const avail = { power: true, ac: viewSeries('ac').length > 0, dc: viewSeries('dc').length > 0 };
    shownView = avail[chartView] ? chartView : 'power';
    $('vtabs').hidden = !avail.ac && !avail.dc;
    document.querySelectorAll('.vtab').forEach(b => {
      b.hidden = !avail[b.dataset.view];
      b.classList.toggle('active', b.dataset.view === shownView);
    });
    const legend = $('history-legend');
    legend.innerHTML = '';
    for (const sr of viewSeries()) {
      const b = document.createElement('button');
      b.className = 'series-toggle' + (chartVisible[sr.key] ? ' active' : '') + (sr.unit === 'A' ? ' dashed' : sr.unit === 'Hz' ? ' dotted' : '');
      b.dataset.key = sr.key;
      b.style.setProperty('--sc', SC(sr.color));
      b.textContent = sr.label();
      legend.appendChild(b);
    }
    $('pstats').hidden = shownView !== 'power';
    $('vstats').hidden = shownView === 'power';
    renderViewStats();
  }

  // renderViewStats: AC/DC's stat cards, one per shown series: the average
  // over the period, with its lowest and highest minute. A PV string's
  // count only while it produces: its nights at 0 would halve the average.
  function renderViewStats() {
    const box = $('vstats');
    if (shownView === 'power') return;
    box.innerHTML = '';
    for (const sr of viewSeries().filter(x => chartVisible[x.key])) {
      let sum = 0, n = 0, lo = Infinity, hi = -Infinity;
      for (const b of historyState.buckets) {
        const v = b[sr.key];
        if (v == null || !Number.isFinite(v) || (sr.producing && v <= 0)) continue;
        sum += v; n++;
        const bmin = b[sr.key + '_min'];
        lo = Math.min(lo, bmin != null && !(sr.producing && bmin <= 0) ? bmin : v);
        hi = Math.max(hi, b[sr.key + '_max'] ?? v);
      }
      const el = document.createElement('div');
      el.className = 'stat';
      const lbl = document.createElement('div');
      lbl.className = 'stat-lbl';
      lbl.style.color = SC(sr.color);
      if (sr.unit === 'Hz') lbl.style.textTransform = 'none'; // a unit, not "HZ"
      lbl.textContent = sr.label();
      const val = document.createElement('div');
      val.innerHTML = '<span class="stat-val"></span><span class="stat-unit"></span>';
      val.firstChild.style.color = SC(sr.color);
      const dec = unitDec(sr.unit);
      val.firstChild.textContent = n ? fmt(sum / n, dec) : '--';
      val.lastChild.textContent = sr.unit;
      const range = document.createElement('div');
      range.className = 'vstat-range';
      range.textContent = n ? t('vstat_range', { min: fmt(lo, dec), max: fmt(hi, dec) }) : '';
      el.append(lbl, val, range);
      box.appendChild(el);
    }
  }

  function loadHistory() {
    resetZoom();
    const status = $('history-status');
    status.textContent = t('history_loading');
    fetch(`${API.history}?range=${encodeURIComponent(historyState.range)}&date=${encodeURIComponent(historyState.date)}`)
      .then((r) => {
        if (!r.ok) {
          return parseJsonOrThrow(r).then((d) => {
            throw new Error(d.error || ('HTTP ' + r.status));
          });
        }
        return parseJsonOrThrow(r);
      })
      .then((res) => {
        const buckets = normalizeBuckets(res.buckets);
        historyState.buckets = buckets;
        historyState.start = res.start; historyState.end = res.end;
        drawHistoryChart(buckets);
        renderViewStats();
        status.textContent = `${getHistoryLabel(historyState.range, historyState.date)} · ${t('history_points_suffix', { count: buckets.length })}`;
      })
      .catch((err) => {
        drawHistoryChart([]);
        status.textContent = t('history_error', { msg: err.message });
      });
  }

  let pickerViewDate = null;

  function updateDateDisplay() {
    const d = historyState.date;
    const range = historyState.range;
    $('date-display').textContent =
      range === 'day'   ? isoDateToDisplay(d) :
      range === 'month' ? monthLabel(d) :
                          d.slice(0, 4);
    const today = toDateInputValue(new Date());
    const atOrPastToday =
      range === 'day'   ? d >= today :
      range === 'month' ? cycleStart(d) >= cycleStart(today) :
                          d.slice(0, 4) >= today.slice(0, 4);
    $('btn-date-next').disabled = atOrPastToday;
  }

  function navigateDate(dir) {
    const range = historyState.range;
    const cur = new Date((range === 'month' ? cycleStart(historyState.date) : historyState.date) + 'T00:00:00');
    if (range === 'day')        cur.setDate(cur.getDate() + dir);
    else if (range === 'month') cur.setMonth(cur.getMonth() + dir);
    else                        cur.setFullYear(cur.getFullYear() + dir);
    historyState.date = toDateInputValue(cur);
    updateDateDisplay();
    loadHistory();
    loadTotals();
  }

  function renderDatePicker() {
    const range = historyState.range;
    const today = toDateInputValue(new Date());
    const selected = historyState.date;
    const view = new Date(pickerViewDate + 'T00:00:00');
    const title = $('dp-title');
    const grid = $('dp-grid');
    grid.innerHTML = '';
    $('dp-cycle').classList.toggle('show', range === 'month');
    $('dp-cycle-day').value = String(historyState.monthStartDay);

    if (range === 'day') {
      title.textContent = view.toLocaleDateString(locale(), { month: 'long', year: 'numeric' });
      grid.className = 'dp-grid dp-days';
      for (let dow = 0; dow < 7; dow++) {
        const el = document.createElement('span');
        el.className = 'dp-dow';
        el.textContent = weekdayNarrowName(dow);
        grid.appendChild(el);
      }
      const first = new Date(view.getFullYear(), view.getMonth(), 1);
      const last  = new Date(view.getFullYear(), view.getMonth() + 1, 0);
      for (let i = 0; i < first.getDay(); i++) {
        const el = document.createElement('span');
        el.className = 'dp-cell empty';
        grid.appendChild(el);
      }
      for (let d = 1; d <= last.getDate(); d++) {
        const iso = `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const el = document.createElement('button');
        el.className = 'dp-cell' + (iso === selected ? ' selected' : '') + (iso === today ? ' today' : '');
        if (iso > today) el.disabled = true;
        el.textContent = d;
        el.addEventListener('click', () => { historyState.date = iso; updateDateDisplay(); loadHistory(); loadTotals(); closeDatePicker(); });
        grid.appendChild(el);
      }
    } else if (range === 'month') {
      title.textContent = view.getFullYear();
      grid.className = 'dp-grid dp-months';
      const todayM = cycleStart(today).slice(0, 7);
      const selM   = cycleStart(selected).slice(0, 7);
      const sd     = String(historyState.monthStartDay).padStart(2, '0');
      for (let m = 0; m < 12; m++) {
        const iso  = `${view.getFullYear()}-${String(m+1).padStart(2,'0')}-${sd}`;
        const key  = iso.slice(0, 7);
        const el   = document.createElement('button');
        el.className = 'dp-cell' + (key === selM ? ' selected' : '') + (key === todayM ? ' today' : '');
        if (key > todayM) el.disabled = true;
        el.textContent = monthShortName(m);
        el.addEventListener('click', () => { historyState.date = iso; updateDateDisplay(); loadHistory(); loadTotals(); closeDatePicker(); });
        grid.appendChild(el);
      }
    } else {
      const decade = Math.floor(view.getFullYear() / 10) * 10;
      title.textContent = `${decade} – ${decade + 9}`;
      grid.className = 'dp-grid dp-years';
      const todayY = today.slice(0, 4);
      const selY   = selected.slice(0, 4);
      for (let y = decade; y <= decade + 9; y++) {
        const iso = `${y}-01-01`;
        const el  = document.createElement('button');
        el.className = 'dp-cell' + (String(y) === selY ? ' selected' : '') + (String(y) === todayY ? ' today' : '');
        if (y > parseInt(todayY)) el.disabled = true;
        el.textContent = y;
        el.addEventListener('click', () => { historyState.date = iso; updateDateDisplay(); loadHistory(); loadTotals(); closeDatePicker(); });
        grid.appendChild(el);
      }
    }
  }

  function pickerNavigate(dir) {
    const range = historyState.range;
    const cur = new Date(pickerViewDate + 'T00:00:00');
    if (range === 'day')        cur.setMonth(cur.getMonth() + dir);
    else if (range === 'month') cur.setFullYear(cur.getFullYear() + dir);
    else                        cur.setFullYear(cur.getFullYear() + dir * 10);
    pickerViewDate = toDateInputValue(cur);
    renderDatePicker();
  }

  function openDatePicker() {
    pickerViewDate = historyState.date;
    renderDatePicker();
    $('date-picker').classList.add('open');
  }

  function closeDatePicker() {
    $('date-picker').classList.remove('open');
  }

  function initHistory() {
    const today = toDateInputValue(new Date());
    historyState.date = today;
    historyState.range = 'day';
    updateDateDisplay();

    $('btn-date-prev').addEventListener('click', () => navigateDate(-1));
    $('btn-date-next').addEventListener('click', () => navigateDate(1));
    $('date-display').addEventListener('click', (e) => { e.stopPropagation(); $('date-picker').classList.contains('open') ? closeDatePicker() : openDatePicker(); });
    $('dp-prev').addEventListener('click', () => pickerNavigate(-1));
    $('dp-next').addEventListener('click', () => pickerNavigate(1));
    const cycleSel = $('dp-cycle-day');
    for (let d = 1; d <= 28; d++) cycleSel.add(new Option(String(d), String(d)));
    cycleSel.addEventListener('change', async () => {
      const prev = historyState.monthStartDay;
      const day = parseInt(cycleSel.value, 10);
      try {
        const r = await fetch(API.monthStart, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ day }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } catch (e) {
        cycleSel.value = String(prev);
        $('history-status').textContent = t('err_generic', { msg: e.message });
        return;
      }
      // Keep the month shown (its name), now starting on the new day.
      const today = toDateInputValue(new Date());
      const month = cycleStart(historyState.date).slice(0, 7);
      historyState.monthStartDay = day;
      const next = `${month}-${String(day).padStart(2, '0')}`;
      historyState.date = next > today ? today : next;
      updateDateDisplay();
      renderDatePicker();
      loadHistory();
      loadTotals();
    });
    fetch(API.monthStart)
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d || !d.day || d.day === historyState.monthStartDay) return;
        historyState.monthStartDay = d.day;
        updateDateDisplay();
      })
      .catch(() => {});
    $('dp-today').addEventListener('click', () => { historyState.date = toDateInputValue(new Date()); updateDateDisplay(); loadHistory(); loadTotals(); closeDatePicker(); });
    document.addEventListener('click', (e) => { if (!e.target.closest('.date-nav-wrap')) closeDatePicker(); });

    document.querySelectorAll('.atab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.atab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        historyState.range = btn.dataset.period;
        resetZoom();
        closeDatePicker();
        updateDateDisplay();
        loadHistory();
        loadTotals();
      });
    });

    window.addEventListener('resize', () => drawHistoryChart(historyState.buckets));
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { loadHistory(); loadTotals(); }
    });

    $('history-legend').addEventListener('click', (e) => {
      const btn = e.target.closest('.series-toggle');
      if (!btn) return;
      const key = btn.dataset.key;
      chartVisible[key] = !chartVisible[key];
      btn.classList.toggle('active', chartVisible[key]);
      try { localStorage.setItem('solastat_chart_series', JSON.stringify(chartVisible)); } catch (_) {}
      drawHistoryChart(historyState.buckets);
      renderViewStats();
    });
    document.querySelectorAll('.vtab').forEach(btn => {
      btn.addEventListener('click', () => {
        chartView = btn.dataset.view;
        try { localStorage.setItem('solastat_chart_view', chartView); } catch (_) {}
        renderChartView();
        drawHistoryChart(historyState.buckets);
      });
    });
    renderChartView();

    setupHistoryAutoRefresh();
    loadHistory();
    initChartHover();
  }

  function drawHoverOverlay(cssX) {
    const { plot, snapshot, buckets, dpr, scales } = chartState;
    if (!plot || !snapshot || !buckets.length) return;
    const ctx = $('history-canvas').getContext('2d', { willReadFrequently: true });
    ctx.putImageData(snapshot, 0, 0);
    if (cssX < plot.x || cssX > plot.x + plot.w) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const frac = Math.max(0, Math.min(1, (cssX - plot.x) / plot.w));
    const idx = Math.round(frac * (buckets.length - 1));
    const bucket = buckets[idx];
    if (!bucket) return;
    const x = plot.x + (idx / Math.max(1, buckets.length - 1)) * plot.w;
    ctx.save();
    ctx.strokeStyle = TC('rgba(161,161,170,0.3)', 'rgba(82,82,91,0.35)');
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(x, plot.y); ctx.lineTo(x, plot.y + plot.h);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    for (const s of viewSeries()) {
      const v = bucket[s.key];
      if (!chartVisible[s.key] || v == null || !Number.isFinite(v) || !scales[s.unit]) continue;
      const { yMin, yMax } = scales[s.unit];
      const y = plot.y + (1 - ((v - yMin) / Math.max(1e-9, yMax - yMin))) * plot.h;
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = SC(s.color); ctx.fill();
      ctx.strokeStyle = TC('#0a0a0b', '#fafafa'); ctx.lineWidth = 1.5; ctx.stroke();
    }
    drawTooltip(ctx, x, bucket, plot, historyState.range);
  }

  function initChartHover() {
    const canvas = $('history-canvas');
    canvas.style.cursor = 'crosshair';

    let isDragging = false;
    let dragStartX = 0;
    let dragSnapStart = 0, dragSnapEnd = -1;
    let touchStartDist = 0, touchSnapStart = 0, touchSnapEnd = -1, touchSnapCenter = 0;

    // ── Wheel zoom ──────────────────────────────────────────
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const all = chartState.allBuckets;
      if (!all.length || !chartState.plot) return;
      const total = all.length;
      const curEnd = zoomState.end < 0 ? total - 1 : zoomState.end;
      const curRange = curEnd - zoomState.start + 1;
      const rect = canvas.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - rect.left - chartState.plot.x) / chartState.plot.w));
      const factor = e.deltaY > 0 ? 1.35 : 1 / 1.35;
      const newRange = Math.max(10, Math.min(total, Math.round(curRange * factor)));
      const center = zoomState.start + frac * (curRange - 1);
      let ns = Math.round(center - frac * (newRange - 1));
      let ne = ns + newRange - 1;
      if (ns < 0) { ns = 0; ne = newRange - 1; }
      if (ne >= total) { ne = total - 1; ns = Math.max(0, ne - newRange + 1); }
      zoomState.start = ns;
      zoomState.end = ne >= total - 1 ? -1 : ne;
      drawHistoryChart(all);
    }, { passive: false });

    // ── Double-click reset ──────────────────────────────────
    canvas.addEventListener('dblclick', () => {
      resetZoom();
      drawHistoryChart(chartState.allBuckets);
    });

    // ── Mouse drag pan ──────────────────────────────────────
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragSnapStart = zoomState.start;
      dragSnapEnd   = zoomState.end;
      canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const cssX = e.clientX - rect.left;
      if (isDragging) {
        const all = chartState.allBuckets;
        if (!all.length || !chartState.plot) return;
        const total = all.length;
        const snapEnd = dragSnapEnd < 0 ? total - 1 : dragSnapEnd;
        const range = snapEnd - dragSnapStart;
        const shift = Math.round(-(e.clientX - dragStartX) * range / chartState.plot.w);
        let ns = dragSnapStart + shift, ne = ns + range;
        if (ns < 0) { ns = 0; ne = range; }
        if (ne >= total) { ne = total - 1; ns = Math.max(0, ne - range); }
        zoomState.start = ns;
        zoomState.end = ne >= total - 1 ? -1 : ne;
        drawHistoryChart(all);
      } else {
        drawHoverOverlay(cssX);
      }
    });

    canvas.addEventListener('mouseup',    () => { isDragging = false; canvas.style.cursor = 'crosshair'; });
    canvas.addEventListener('mouseleave', () => {
      isDragging = false;
      canvas.style.cursor = 'crosshair';
      const { snapshot } = chartState;
      if (snapshot) $('history-canvas').getContext('2d', { willReadFrequently: true }).putImageData(snapshot, 0, 0);
    });

    // ── Touch: tap = tooltip fixo, swipe = pan, pinch = zoom ─
    let touchMoved = false;

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        touchMoved    = false;
        dragStartX    = e.touches[0].clientX;
        dragSnapStart = zoomState.start;
        dragSnapEnd   = zoomState.end;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchMoved = true;
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        touchStartDist = Math.abs(dx);
        touchSnapStart = zoomState.start;
        touchSnapEnd   = zoomState.end;
        const all = chartState.allBuckets;
        const total = all.length;
        const snapEnd = touchSnapEnd < 0 ? total - 1 : touchSnapEnd;
        const rect = canvas.getBoundingClientRect();
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const frac  = Math.max(0, Math.min(1, (midX - rect.left - (chartState.plot?.x || 0)) / (chartState.plot?.w || 1)));
        touchSnapCenter = touchSnapStart + frac * (snapEnd - touchSnapStart);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const all = chartState.allBuckets;
      if (!all.length || !chartState.plot) return;
      const total = all.length;
      if (e.touches.length === 1) {
        const dx = Math.abs(e.touches[0].clientX - dragStartX);
        if (dx > 8) touchMoved = true;
        if (touchMoved) {
          // pan
          const snapEnd = dragSnapEnd < 0 ? total - 1 : dragSnapEnd;
          const range = snapEnd - dragSnapStart;
          const shift = Math.round(-(e.touches[0].clientX - dragStartX) * range / chartState.plot.w);
          let ns = dragSnapStart + shift, ne = ns + range;
          if (ns < 0) { ns = 0; ne = range; }
          if (ne >= total) { ne = total - 1; ns = Math.max(0, ne - range); }
          zoomState.start = ns;
          zoomState.end = ne >= total - 1 ? -1 : ne;
          drawHistoryChart(all);
        } else {
          // preview tooltip while holding still
          const rect = canvas.getBoundingClientRect();
          drawHoverOverlay(e.touches[0].clientX - rect.left);
        }
      } else if (e.touches.length === 2) {
        const dist = Math.abs(e.touches[1].clientX - e.touches[0].clientX);
        const snapEnd = touchSnapEnd < 0 ? total - 1 : touchSnapEnd;
        const snapRange = snapEnd - touchSnapStart + 1;
        const newRange = Math.max(10, Math.min(total, Math.round(snapRange * touchStartDist / Math.max(1, dist))));
        const rect = canvas.getBoundingClientRect();
        const midX  = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const frac   = Math.max(0, Math.min(1, (midX - rect.left - chartState.plot.x) / chartState.plot.w));
        let ns = Math.round(touchSnapCenter - frac * (newRange - 1));
        let ne = ns + newRange - 1;
        if (ns < 0) { ns = 0; ne = newRange - 1; }
        if (ne >= total) { ne = total - 1; ns = Math.max(0, ne - newRange + 1); }
        zoomState.start = ns;
        zoomState.end = ne >= total - 1 ? -1 : ne;
        drawHistoryChart(all);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (!touchMoved && e.changedTouches.length === 1) {
        // tap: pin tooltip at this position
        const rect = canvas.getBoundingClientRect();
        drawHoverOverlay(e.changedTouches[0].clientX - rect.left);
      } else if (touchMoved && chartState.snapshot) {
        // swipe ended: restore clean chart
        $('history-canvas').getContext('2d', { willReadFrequently: true }).putImageData(chartState.snapshot, 0, 0);
      }
      isDragging  = false;
      touchMoved  = false;
    });
  }

  // ── Flow line animation ───────────────────────────────────
  // 'fwd' = power flows in forward direction (source → sink along the drawn line)
  // 'rev' = reverse direction
  function setLine(id, state) {  // state: 'fwd' | 'rev' | 'off'
    const el = $(id);
    if (!el) return;
    el.classList.remove('fwd', 'rev');
    if (state === 'fwd' || state === 'rev') el.classList.add(state);
  }

  // Toggles a node's glow pulse — same on/off thresholds as the connecting
  // line into/out of it, so a node only ever looks "alive" while power is
  // actually moving through it.
  function setNodeActive(prefix, active) {
    $(`node-${prefix}-glow`)?.classList.toggle('active', active);
  }

  const flowState = {
    lastTs: 0,
    progress: { solar: 0, battery: 0, grid: 0 },
    latest: { solarW: 0, battW: 0, gridW: 0 },
  };

  function speedFromPower(power, threshold) {
    const p = Math.abs(Number(power || 0));
    if (p <= threshold) return 0;
    const norm = Math.min(p, 5000) / 5000;
    return 0.22 + norm * 1.5; // cycles/second
  }

  function setParticle(id, x1, y1, x2, y2, t, opacity, r) {
    const el = $(id);
    if (!el) return;
    el.setAttribute('cx', (x1 + (x2 - x1) * t).toFixed(2));
    el.setAttribute('cy', (y1 + (y2 - y1) * t).toFixed(2));
    el.setAttribute('r', r.toFixed(2));
    el.style.opacity = opacity > 0 ? String(opacity) : '0';
  }

  function particleCountFromPower(power, threshold) {
    const p = Math.abs(Number(power || 0));
    if (p <= threshold) return 0;
    if (p <= threshold * 6) return 1;
    if (p <= threshold * 16) return 2;
    return 3;
  }

  function renderFlowParticles(prefix, x1, y1, x2, y2, progress, count, reverse) {
    const offsets = [0, 0.33, 0.66];
    for (let i = 0; i < 3; i++) {
      const id = `${prefix}-${i + 1}`;
      if (i >= count) {
        setParticle(id, x1, y1, x2, y2, 0, 0, i === 0 ? 3.4 : 2.7);
        continue;
      }
      let t = (progress + offsets[i]) % 1;
      if (reverse) t = 1 - t;
      const opacity = i === 0 ? 0.95 : (i === 1 ? 0.7 : 0.45);
      const tStart = reverse ? 1 - t : t;
      const r = i === 0 ? 3.4 + (1 - tStart) * 5 : 2.7 + (1 - tStart) * 1.5;
      setParticle(id, x1, y1, x2, y2, t, opacity, r);
    }
  }

  function animateFlow(ts) {
    if (!flowState.lastTs) flowState.lastTs = ts;
    const dt = Math.max(0, (ts - flowState.lastTs) / 1000);
    flowState.lastTs = ts;

    const { solarW, battW, gridW } = flowState.latest;

    flowState.progress.solar = (flowState.progress.solar + speedFromPower(solarW, 10) * dt) % 1;
    flowState.progress.battery = (flowState.progress.battery + speedFromPower(battW, 10) * dt) % 1;
    flowState.progress.grid = (flowState.progress.grid + speedFromPower(gridW, 50) * dt) % 1;

    const solarCount = particleCountFromPower(solarW, 10);
    const battCount = particleCountFromPower(battW, 10);
    const gridCount = particleCountFromPower(gridW, 50);

    renderFlowParticles('pt-solar', 180, 76, 180, 126, flowState.progress.solar, solarCount, false);
    renderFlowParticles('pt-battery', 155, 193, 96, 233, flowState.progress.battery, battCount, (battW || 0) > 0);
    renderFlowParticles('pt-grid', 205, 193, 264, 233, flowState.progress.grid, gridCount, (gridW || 0) > 0);

    requestAnimationFrame(animateFlow);
  }

  // ── SSE ──────────────────────────────────────────────────
  function connect() {
    const sse = new EventSource(API.events);

    sse.onopen = () => {
      $('dot').classList.add('on');
    };

    sse.onerror = () => {
      $('dot').classList.remove('on');
      sse.close();
      // Short delay: these drops have been observed self-healing quickly
      // (a relay-side connection recycle, not a real outage), so recover
      // fast rather than leaving the dashboard visibly stale for 5s+.
      setTimeout(connect, 2000);
    };

    sse.onmessage = (e) => {
      try { render(JSON.parse(e.data)); } catch (_) {}
    };
  }


  // Battery icon on the flow diagram: the inside fills with the state of
  // charge (0-100 %), green, amber below 50 % and red below 20 %.
  function setBatteryFill(soc) {
    const pct = Math.max(0, Math.min(100, soc));
    const fill = $('sv-batt-fill');
    fill.setAttribute('width', (12 * pct / 100).toFixed(2)); // inner width of the 16-wide body
    fill.setAttribute('fill', pct < 20 ? 'var(--danger)' : pct < 50 ? 'var(--warn)' : TC('#6ee7b7', '#059669'));
  }

  function render(d) {
    lastRenderData = d;
    const r   = d.readings || {};
    const get = (n) => (r[n] != null ? r[n].value : null);
    const before = seenReadings.size;
    for (const name in r) {
      if (/^grid_voltage_l[23]$/.test(name) && !(r[name].value > 50)) continue; // no such phase
      seenReadings.add(name);
    }
    if (seenReadings.size !== before) {
      renderChartView();
      drawHistoryChart(historyState.buckets);
    }

    // A live SSE connection alone doesn't mean the poll cycle behind it
    // actually succeeded — d.error means this cycle failed a Modbus read,
    // same signal the error bar and inverter-status text below already
    // key off of, so the dot shouldn't just default to "connected" green
    // regardless of it.
    const dot = $('dot');
    dot.classList.toggle('on', !d.error);
    dot.classList.toggle('warn', !!d.error);

    // ── Live power values ─────────────────────────────────
    const solarW = get('pv_total_power');
    const gridW  = get('measured_power');
    const battW  = get('battery_power');
    const loadW  = get('total_consumption_power');
    const soc    = get('battery_level');

    if (solarW != null) $('sv-solar-w').textContent = fmt(solarW) + 'W';
    if (loadW  != null) $('sv-load-w').textContent  = fmt(loadW)  + 'W';
    if (soc    != null) {
      $('sv-soc').textContent = fmt(soc) + '%';
      setBatteryFill(soc);
    }
    if (battW  != null) {
      $('sv-batt-w').textContent     = fmt(Math.abs(battW)) + 'W';
      $('sv-batt-arrow').textContent = battW > 50 ? '↑' : battW < -50 ? '↓' : '';
    }

    if (gridW != null) {
      $('sv-grid-w').textContent     = fmt(Math.abs(gridW)) + 'W';
      $('sv-grid-arrow').textContent = gridW > 50 ? '↑' : gridW < -50 ? '↓' : '';
    }
    // Grid frequency: amber off 49.8-50.2 Hz, red off 49.5-50.5 Hz (on a
    // 60 Hz grid, the same bands around 60).
    const gridHz = get('grid_frequency');
    if (gridHz != null) {
      const off = Math.abs(gridHz - (gridHz > 55 ? 60 : 50));
      const hz = $('sv-grid-hz');
      hz.textContent = fmt(gridHz, 2) + ' Hz';
      hz.setAttribute('fill', off > 0.5 ? 'var(--danger)' : off > 0.2 ? 'var(--warn)' : 'var(--muted)');
      hz.style.display = '';
      $('sv-grid-lbl').setAttribute('y', '277');
    }

    flowState.latest.solarW = solarW ?? 0;
    flowState.latest.battW = battW ?? 0;
    flowState.latest.gridW = gridW ?? 0;

    // ── Animated flow lines ───────────────────────────────
    // Solar line: always solar→home (forward when producing)
    const solarActive = solarW > 10;
    setLine('ln-solar', solarActive ? 'fwd' : 'off');
    setNodeActive('solar', solarActive);

    // Battery line is drawn home→battery;
    // For this inverter profile: battery_power < 0 = charging (home→battery = fwd)
    // battery_power > 0 = discharging (battery→home = rev)
    const batteryActive = battW != null && Math.abs(battW) > 10;
    if (batteryActive) {
      setLine('ln-battery', battW < 0 ? 'fwd' : 'rev');
    } else {
      setLine('ln-battery', 'off');
    }
    setNodeActive('battery', batteryActive);

    // Grid line is drawn home→grid;
    // measured_power > 0 = import (grid→home = rev)
    // measured_power < 0 = export (home→grid = fwd)
    const gridActive = gridW != null && Math.abs(gridW) > 50;
    if (gridActive) {
      setLine('ln-grid', gridW > 0 ? 'rev' : 'fwd');
    } else {
      setLine('ln-grid', 'off');
    }
    setNodeActive('grid', gridActive);

    // Home is the one node with no single "off" state of its own — it's
    // fed by up to three lines at once, so it glows whenever there's any
    // load at all, independent of which source is currently supplying it.
    setNodeActive('home', loadW != null && loadW > 5);

    // ── Battery health (only if register present) ─────────
    const bhealth = get('battery_health');
    if (bhealth != null) {
      $('sv-bhealth').textContent = fmt(bhealth, 0) + '%';
      $('sv-bhealth-grp').style.display = '';
      $('sv-batt-lbl').setAttribute('y', '277');
    }

    // ── Error bar ─────────────────────────────────────────
    const eb = $('err-bar');
    if (d.error) {
      eb.style.display = 'block';
      eb.textContent   = '⚠️ ' + d.error;
    } else {
      eb.style.display = 'none';
    }

    // ── Status (shown after the profile name, e.g. "Swatten (OK)") ──
    // d.error means THIS poll cycle failed a Modbus read — that always wins
    // over the inverter's own fault status, even when its register was read
    // fine earlier in the same (otherwise failed) cycle, so a comms error
    // never gets shown as "OK". d.fault comes from inverter_status (an error
    // code), the profile's fault_state (e.g. Deye's run state) and its fault
    // registers, whose faults have names: those are shown when there are any.
    const statusEl = $('inverter-status-text');
    const fault = d.fault;
    let statusText, statusColor;
    if (d.error) {
      statusText = t('status_error'); statusColor = 'var(--danger)';
    } else if (!fault) {
      statusText = t('status_dash'); statusColor = 'var(--muted)';
    } else if (!fault.active) {
      statusText = t('status_ok'); statusColor = 'var(--battery)';
    } else {
      const named = (fault.faults || []).filter(f => f.source === 'registers');
      const status = (fault.faults || []).find(f => f.source === 'status' && f.name);
      if (named.length) {
        statusText = t('status_fault_named', { name: faultName(named[0]) + (named.length > 1 ? ' +' + (named.length - 1) : '') });
      } else {
        statusText = t(fault.kind === 'state' ? 'status_fault_state' : 'status_error_code', { code: fault.code })
          + (status ? ' · ' + status.name : '');
      }
      statusColor = 'var(--danger)';
    }
    statusEl.textContent = ` (${statusText})`;
    statusEl.style.color = statusColor;
  }

  // A fault as the core's faultName shows it: "F18 · AC Over-current failure",
  // its name or code alone, or its group and number when it has neither.
  function faultName(f) {
    if (f.code && f.name) return f.code + ' · ' + f.name;
    if (f.name) return f.name;
    return f.group + ' ' + (f.code || f.id.split(/[.=]/).pop());
  }

  function loadTotals() {
    fetch(API.totals + '?period=' + historyState.range + '&date=' + encodeURIComponent(historyState.date))
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d) return;
        $('st-solar').textContent       = fmt(d.solar_kwh,       1);
        $('st-load').textContent        = fmt(d.load_kwh,        1);
        $('st-import').textContent      = fmt(d.import_kwh,      1);
        $('st-export').textContent      = fmt(d.export_kwh,      1);
        $('st-bcharged').textContent    = fmt(d.bcharged_kwh,    1);
        $('st-bdischarged').textContent = fmt(d.bdischarged_kwh, 1);
      })
      .catch(() => {});
  }

  applyStaticI18n();

  initHistory();

  // ── Kiosk: full screen, the flow and the chart side by side ──
  // The button (or ?kiosk=1 in the address, for a screen that boots
  // straight into it) switches the layout; it also asks the browser for
  // full screen when it can. Esc or the button leave it. While in it the
  // cursor and the button hide after a few idle seconds, a clock shows
  // the time, and the page moves a few pixels now and then so nothing
  // burns into the screen.
  (function initKiosk() {
    const btn = $('kiosk-btn');
    let idleTimer = null, clockTimer = null, shiftTimer = null;

    function setTitle(key) {
      btn.dataset.i18nTitle = key;
      btn.dataset.i18nAriaLabel = key;
      btn.title = t(key);
      btn.setAttribute('aria-label', t(key));
    }
    function tickClock() {
      const now = new Date();
      $('kiosk-time').textContent = now.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit', hour12: false });
      $('kiosk-date').textContent = now.toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long' });
    }
    function shift() {
      const r = () => Math.round(Math.random() * 8 - 4) + 'px';
      document.body.style.setProperty('--kiosk-dx', r());
      document.body.style.setProperty('--kiosk-dy', r());
    }
    function wake() {
      document.body.classList.remove('kiosk-idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('kiosk-idle'), 3000);
    }
    const redraw = () => requestAnimationFrame(() => drawHistoryChart(historyState.buckets));

    function enter(fullscreen) {
      if (document.body.classList.contains('kiosk')) return;
      document.body.classList.add('kiosk');
      setTitle('kiosk_exit');
      tickClock();
      clockTimer = setInterval(tickClock, 10000);
      shiftTimer = setInterval(shift, 5 * 60 * 1000);
      document.addEventListener('mousemove', wake);
      document.addEventListener('touchstart', wake);
      wake();
      const el = document.documentElement;
      if (fullscreen && el.requestFullscreen && !document.fullscreenElement) {
        el.requestFullscreen().catch(() => {}); // not allowed: the layout alone
      }
      redraw();
    }
    function exit() {
      if (!document.body.classList.contains('kiosk')) return;
      document.body.classList.remove('kiosk', 'kiosk-idle');
      document.body.style.removeProperty('--kiosk-dx');
      document.body.style.removeProperty('--kiosk-dy');
      setTitle('kiosk_enter');
      clearInterval(clockTimer); clearInterval(shiftTimer); clearTimeout(idleTimer);
      document.removeEventListener('mousemove', wake);
      document.removeEventListener('touchstart', wake);
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      redraw();
    }

    btn.addEventListener('click', () => {
      if (document.body.classList.contains('kiosk')) exit(); else enter(true);
    });
    // Esc in full screen only leaves full screen: leave the kiosk with it.
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) exit(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') exit(); });

    if (new URLSearchParams(window.location.search).get('kiosk') === '1') enter(false);
  })();
  loadTotals();
  setInterval(() => { if (!document.hidden) loadTotals(); }, 5 * 60 * 1000);
  requestAnimationFrame(animateFlow);


  // ── Activity log (inverter status, relay, smartspot — merged,
  // paginated, newest first). Backed by a bounded in-RAM ring buffer on
  // the core (see internal/eventlog): entries fall off once it's full,
  // and it starts empty on every restart — there's nothing to page back
  // to past what the core currently holds. ──────────────────────
  let logOffset = 0;
  const logLimit = 10;

  function loadEventLog() {
    fetch(apiBase + '/api/logs?limit=' + logLimit + '&offset=' + logOffset)
      .then(r => r.json())
      .then(d => {
        const el = $('event-log');
        const events = d.events || [];
        const total = d.total || 0;

        if (!events.length) {
          el.innerHTML = '<li class="empty">' + t('log_no_activity') + '</li>';
        } else {
          // "core" is the small, fixed set of events the core itself
          // detects (battery, comms, inverter) — translated here by kind.
          // Any other source is an opaque plugin ID: rendered generically
          // off Text/OK alone, exactly like a brand-new notification type
          // needs no change here (see eventlog.Entry's doc comment) — this
          // page never special-cases which plugins exist.
          el.innerHTML = events.map(e => {
            const tstr = fmtDateTime(new Date(e.ts), true);
            if (e.source === 'core') {
              const coreDots = { battery_full: 'on', battery_low: 'warn', comm_error: 'warn', comm_ok: 'on', inverter_fault: 'warn', inverter_fault_state: 'warn', inverter_fault_named: 'warn' };
              const coreLabels = {
                battery_full: () => t('log_battery_full'),
                // A 0% level has no code (omitted when zero).
                battery_low: () => t('log_battery_low', { level: e.code || 0 }),
                comm_error: () => t('log_comm_error'),
                comm_ok: () => t('log_comm_ok'),
                inverter_fault: () => t('log_inverter_error', { code: e.code }) + ((e.args || {}).name ? ' · ' + e.args.name : ''),
                inverter_fault_state: () => t('log_inverter_fault_state', { code: e.code }),
                inverter_fault_named: () => t('log_inverter_fault_named', { names: (e.args || {}).names || '' }),
                profile_changed: () => t('log_profile_changed', e.args || {}),
                config_restored: () => t('log_config_restored'),
                inverter_restarted: () => t('log_inverter_restarted'),
              };
              const dot = coreDots[e.kind] || '';
              const label = (coreLabels[e.kind] || (() => e.text))();
              return '<li><span class="dot ' + dot + '"></span>' + tstr + ' — ' + label + '</li>';
            }
            const dot = e.ok ? 'on' : 'warn';
            return '<li><span class="dot ' + dot + '"></span>' + tstr + ' — ' + (e.text || e.kind || '') + '</li>';
          }).join('');
        }

        $('event-log-prev').disabled = logOffset <= 0;
        $('event-log-next').disabled = logOffset + logLimit >= total;
        $('event-log-page-info').textContent = total
          ? t('log_page_info', { from: logOffset + 1, to: Math.min(logOffset + logLimit, total), total })
          : '';
      })
      .catch(() => {});
  }

  $('event-log-prev').addEventListener('click', () => {
    logOffset = Math.max(0, logOffset - logLimit);
    loadEventLog();
  });
  $('event-log-next').addEventListener('click', () => {
    logOffset += logLimit;
    loadEventLog();
  });

  loadEventLog();
  // Only auto-refresh while viewing the first (newest) page, so paging
  // through older entries isn't disrupted by the list shifting underneath.
  // Not while the tab is hidden: the device isn't asked for what no one
  // sees; it's read again the moment the tab comes back.
  setInterval(() => { if (logOffset === 0 && !document.hidden) loadEventLog(); }, 5000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && logOffset === 0) loadEventLog();
  });

  // ── Active inverter profile label next to the status dot ──
  function refreshActiveProfileLabel() {
    fetch(API.profile)
      .then(r => r.ok ? parseJsonOrThrow(r) : null)
      .then(d => {
        if (!d) return;
        const name = (d.profile && d.profile.name) || d.id || '';
        $('active-profile-label').textContent = name;
      })
      .catch(() => {});
  }
  refreshActiveProfileLabel();
  setInterval(() => { if (!document.hidden) refreshActiveProfileLabel(); }, 30000);

  connect();

</script>
</body>
</html>
